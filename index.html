<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カウンターアプリ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            min-width: 300px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        #counter {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            transition: transform 0.2s;
        }

        #counter.pulse {
            transform: scale(1.2);
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        #increment {
            background: #4CAF50;
            color: white;
        }

        #increment:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        #decrement {
            background: #f44336;
            color: white;
        }

        #decrement:hover {
            background: #da190b;
            transform: translateY(-2px);
        }

        #reset {
            background: #ff9800;
            color: white;
        }

        #reset:hover {
            background: #e68900;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 カウンターアプリ</h1>
        <div id="counter">0</div>
        <div class="buttons">
            <button id="decrement">➖ 減らす</button>
            <button id="reset">🔄 リセット</button>
            <button id="increment">➕ 増やす</button>
        </div>
    </div>

    <script>
        // IndexedDB管理クラス
        class CounterDB {
            constructor(dbName = 'CounterDB', storeName = 'counters', version = 1) {
                this.dbName = dbName;
                this.storeName = storeName;
                this.version = version;
                this.db = null;
            }

            // データベースを初期化
            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.version);

                    request.onerror = () => {
                        console.error('IndexedDB のオープンに失敗しました');
                        reject(request.error);
                    };

                    request.onsuccess = () => {
                        this.db = request.result;
                        console.log('IndexedDB が正常に開かれました');
                        resolve(this.db);
                    };

                    request.onupgradeneeded = (event) => {
                        this.db = event.target.result;

                        // オブジェクトストアが存在しない場合は作成
                        if (!this.db.objectStoreNames.contains(this.storeName)) {
                            const objectStore = this.db.createObjectStore(this.storeName, { keyPath: 'id' });
                            console.log(`オブジェクトストア "${this.storeName}" を作成しました`);
                        }
                    };
                });
            }

            // 値を読み込む
            async load(key, defaultValue = 0) {
                return new Promise((resolve, reject) => {
                    if (!this.db) {
                        reject(new Error('データベースが初期化されていません'));
                        return;
                    }

                    const transaction = this.db.transaction([this.storeName], 'readonly');
                    const objectStore = transaction.objectStore(this.storeName);
                    const request = objectStore.get(key);

                    request.onsuccess = () => {
                        if (request.result) {
                            resolve(request.result.value);
                        } else {
                            resolve(defaultValue);
                        }
                    };

                    request.onerror = () => {
                        console.error('データの読み込みに失敗しました');
                        reject(request.error);
                    };
                });
            }

            // 値を保存する
            async save(key, value) {
                return new Promise((resolve, reject) => {
                    if (!this.db) {
                        reject(new Error('データベースが初期化されていません'));
                        return;
                    }

                    const transaction = this.db.transaction([this.storeName], 'readwrite');
                    const objectStore = transaction.objectStore(this.storeName);
                    const request = objectStore.put({ id: key, value: value });

                    request.onsuccess = () => {
                        console.log('データを保存しました:', { key, value });
                        resolve();
                    };

                    request.onerror = () => {
                        console.error('データの保存に失敗しました');
                        reject(request.error);
                    };
                });
            }

            // 値を削除する
            async delete(key) {
                return new Promise((resolve, reject) => {
                    if (!this.db) {
                        reject(new Error('データベースが初期化されていません'));
                        return;
                    }

                    const transaction = this.db.transaction([this.storeName], 'readwrite');
                    const objectStore = transaction.objectStore(this.storeName);
                    const request = objectStore.delete(key);

                    request.onsuccess = () => {
                        console.log('データを削除しました:', key);
                        resolve();
                    };

                    request.onerror = () => {
                        console.error('データの削除に失敗しました');
                        reject(request.error);
                    };
                });
            }

            // すべてのデータを取得
            async getAll() {
                return new Promise((resolve, reject) => {
                    if (!this.db) {
                        reject(new Error('データベースが初期化されていません'));
                        return;
                    }

                    const transaction = this.db.transaction([this.storeName], 'readonly');
                    const objectStore = transaction.objectStore(this.storeName);
                    const request = objectStore.getAll();

                    request.onsuccess = () => {
                        resolve(request.result);
                    };

                    request.onerror = () => {
                        console.error('すべてのデータの取得に失敗しました');
                        reject(request.error);
                    };
                });
            }

            // データベースを閉じる
            close() {
                if (this.db) {
                    this.db.close();
                    console.log('IndexedDB を閉じました');
                }
            }
        }

        // 変数の初期化
        let count = 0;
        const counterDB = new CounterDB();

        // 要素の取得
        const counterDisplay = document.getElementById('counter');
        const incrementBtn = document.getElementById('increment');
        const decrementBtn = document.getElementById('decrement');
        const resetBtn = document.getElementById('reset');

        // アニメーション効果を追加する関数
        function addPulseEffect() {
            counterDisplay.classList.add('pulse');
            setTimeout(() => {
                counterDisplay.classList.remove('pulse');
            }, 200);
        }

        // カウンターを更新する関数
        async function updateCounter() {
            counterDisplay.textContent = count;
            addPulseEffect();

            // カウントに応じて色を変更
            if (count > 0) {
                counterDisplay.style.color = '#4CAF50';
            } else if (count < 0) {
                counterDisplay.style.color = '#f44336';
            } else {
                counterDisplay.style.color = '#667eea';
            }

            // IndexedDBに保存
            try {
                await counterDB.save('mainCounter', count);
            } catch (error) {
                console.error('保存エラー:', error);
            }
        }

        // アプリケーションの初期化
        async function initApp() {
            try {
                // IndexedDBを初期化
                await counterDB.init();

                // 保存されたカウント値を読み込む
                const savedCount = await counterDB.load('mainCounter', 0);
                count = savedCount;
                counterDisplay.textContent = count;

                // 初期表示時も色を設定
                if (count > 0) {
                    counterDisplay.style.color = '#4CAF50';
                } else if (count < 0) {
                    counterDisplay.style.color = '#f44336';
                } else {
                    counterDisplay.style.color = '#667eea';
                }

                console.log('アプリケーションを初期化しました。カウント値:', count);
            } catch (error) {
                console.error('初期化エラー:', error);
            }
        }

        // イベントリスナーの設定
        incrementBtn.addEventListener('click', () => {
            count++;
            updateCounter();
        });

        decrementBtn.addEventListener('click', () => {
            count--;
            updateCounter();
        });

        resetBtn.addEventListener('click', () => {
            count = 0;
            updateCounter();
        });

        // キーボードショートカット
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                count++;
                updateCounter();
            } else if (e.key === 'ArrowDown') {
                count--;
                updateCounter();
            } else if (e.key === 'r' || e.key === 'R') {
                count = 0;
                updateCounter();
            }
        });

        // アプリケーション起動
        initApp();
    </script>
</body>
</html>
