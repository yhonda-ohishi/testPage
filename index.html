<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カウンターアプリ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            min-width: 300px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        #counter {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            transition: transform 0.2s;
        }

        #counter.pulse {
            transform: scale(1.2);
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        #increment {
            background: #4CAF50;
            color: white;
        }

        #increment:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        #decrement {
            background: #f44336;
            color: white;
        }

        #decrement:hover {
            background: #da190b;
            transform: translateY(-2px);
        }

        #reset {
            background: #ff9800;
            color: white;
        }

        #reset:hover {
            background: #e68900;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 カウンターアプリ</h1>
        <div id="counter">0</div>
        <div class="buttons">
            <button id="decrement">➖ 減らす</button>
            <button id="reset">🔄 リセット</button>
            <button id="increment">➕ 増やす</button>
        </div>
    </div>

    <script>
        // 変数の初期化
        let count = 0;
        
        // 要素の取得
        const counterDisplay = document.getElementById('counter');
        const incrementBtn = document.getElementById('increment');
        const decrementBtn = document.getElementById('decrement');
        const resetBtn = document.getElementById('reset');

        // アニメーション効果を追加する関数
        function addPulseEffect() {
            counterDisplay.classList.add('pulse');
            setTimeout(() => {
                counterDisplay.classList.remove('pulse');
            }, 200);
        }

        // カウンターを更新する関数
        function updateCounter() {
            counterDisplay.textContent = count;
            addPulseEffect();
            
            // カウントに応じて色を変更
            if (count > 0) {
                counterDisplay.style.color = '#4CAF50';
            } else if (count < 0) {
                counterDisplay.style.color = '#f44336';
            } else {
                counterDisplay.style.color = '#667eea';
            }
        }

        // イベントリスナーの設定
        incrementBtn.addEventListener('click', () => {
            count++;
            updateCounter();
        });

        decrementBtn.addEventListener('click', () => {
            count--;
            updateCounter();
        });

        resetBtn.addEventListener('click', () => {
            count = 0;
            updateCounter();
        });

        // キーボードショートカット
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                count++;
                updateCounter();
            } else if (e.key === 'ArrowDown') {
                count--;
                updateCounter();
            } else if (e.key === 'r' || e.key === 'R') {
                count = 0;
                updateCounter();
            }
        });
    </script>
</body>
</html>
